Name: Build Spin Win APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip SpinWinAndroid-v1.0.7-github-build.zip
          cd SpinWinAndroid
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Modify app build.gradle.kts
        run: |
          cat << 'EOF' > "$PROJECT_DIR/app/build.gradle.kts"
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.arcadelab.spinwin"
              compileSdk = 35

              // Fix Java and Kotlin JVM target mismatch
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              androidResources {
                  // SoundPool uses AssetFileDescriptor, which requires uncompressed OGG assets.
                  noCompress += "ogg"
              }

              defaultConfig {
                  applicationId = "com.arcadelab.spinwin"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.0-dev"
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: spinwin-debug-apk
          path: SpinWinAndroid/app/build/outputs/apk/debug/app-debug.apk
