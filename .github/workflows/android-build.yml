name: Build Spin Win APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip SpinWinAndroid-v1.0.7-github-build.zip
          cd SpinWinAndroid
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: spinwin-debug-apk
          path: SpinWinAndroid/app/build/outputs/apk/debug/app-debug.apk
